version: 2
updates:
  # Enable version updates for .NET packages
  - package-ecosystem: "nuget"
    directory: "/GameServer"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "kojeomstudio"
      
  - package-ecosystem: "nuget"
    directory: "/SharedProtocol"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "kojeomstudio"
      
  - package-ecosystem: "nuget"
    directory: "/GameCommon"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    reviewers:
      - "kojeomstudio"
      
  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    reviewers:
      - "kojeomstudio"
