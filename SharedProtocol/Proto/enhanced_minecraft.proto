syntax = "proto3";
package EnhancedMinecraftProtocol;
option csharp_namespace = "EnhancedMinecraftProtocol";

// =============================================================================
// Enhanced Minecraft Protocol - Server Authoritative Messages
// =============================================================================

// =============================================================================
// Player State and Actions
// =============================================================================

message PlayerInfo {
  string player_id = 1;
  string username = 2;
  Vector3 position = 3;
  Vector3 rotation = 4;
  int32 level = 5;
  int32 experience = 6;
  float health = 7;
  float max_health = 8;
  float hunger = 9;
  float max_hunger = 10;
  GameMode game_mode = 11;
  repeated InventoryItem inventory = 12;
  InventoryItem held_item = 13;
  int32 selected_slot = 14;
  bool is_on_ground = 15;
  bool is_sneaking = 16;
  bool is_sprinting = 17;
  bool is_flying = 18;
}

enum GameMode {
  SURVIVAL = 0;
  CREATIVE = 1;
  ADVENTURE = 2;
  SPECTATOR = 3;
}

message PlayerActionRequest {
  PlayerAction action = 1;
  Vector3Int target_position = 2;
  int32 face = 3;
  Vector3 cursor_position = 4;
  InventoryItem used_item = 5;
  int32 sequence = 6;
  string action_data = 7;
}

enum PlayerAction {
  START_DESTROY_BLOCK = 0;
  ABORT_DESTROY_BLOCK = 1;
  STOP_DESTROY_BLOCK = 2;
  PLACE_BLOCK = 3;
  USE_ITEM = 4;
  DROP_ITEM = 5;
  RIGHT_CLICK_BLOCK = 6;
  RIGHT_CLICK_AIR = 7;
  SWAP_HANDS = 8;
}

message PlayerActionResponse {
  bool success = 1;
  string message = 2;
  int32 sequence = 3;
  ActionResult result = 4;
}

message ActionResult {
  repeated InventoryItem updated_items = 1;
  repeated AppliedEffect applied_effects = 2;
  float health_change = 3;
  float hunger_change = 4;
  int32 experience_change = 5;
  ParticleEffect particle_effect = 6;
  SoundEffect sound_effect = 7;
}

message AppliedEffect {
  int32 effect_id = 1;
  int32 duration = 2;
  int32 amplifier = 3;
}

// =============================================================================
// Chunk and World Management
// =============================================================================

message ChunkLoadRequest {
  repeated Vector3Int chunk_positions = 1;
  int32 view_distance = 2;
}

message ChunkLoadResponse {
  repeated ChunkData chunks = 1;
  int32 total_requested = 2;
  int32 total_sent = 3;
}

message ChunkData {
  int32 chunk_x = 1;
  int32 chunk_z = 2;
  bytes block_data = 3;
  bytes biome_data = 4;
  bytes light_data = 5;
  int64 generation_timestamp = 6;
  repeated EntityData entities = 7;
  repeated TileEntityData tile_entities = 8;
}

message ChunkUnloadNotification {
  string player_id = 1;
  int32 chunk_x = 2;
  int32 chunk_z = 3;
  ChunkUnloadReason reason = 4;
  int32 view_distance = 5;
  int64 timestamp_ms = 6;
}

enum ChunkUnloadReason {
  VIEW_DISTANCE = 0;
  MANUAL = 1;
  WORLD_TRANSFER = 2;
  SHUTDOWN = 3;
}

message ChunkUnloadAck {
  int32 chunk_x = 1;
  int32 chunk_z = 2;
  bool accepted = 3;
  int32 remaining_chunks = 4;
  string note = 5;
}

message BlockChangeBroadcast {
  Vector3Int position = 1;
  int32 old_block_id = 2;
  int32 new_block_id = 3;
  int32 metadata = 4;
  string player_name = 5;
  int64 timestamp = 6;
  repeated ItemDropInfo drops = 7;
}

message ItemDropInfo {
  InventoryItem item = 1;
  Vector3 drop_position = 2;
  Vector3 velocity = 3;
  string entity_id = 4;
}

// =============================================================================
// Entity Management
// =============================================================================

message EntityData {
  string entity_id = 1;
  EntityType entity_type = 2;
  Vector3 position = 3;
  Vector3 rotation = 4;
  Vector3 velocity = 5;
  float health = 6;
  float max_health = 7;
  string metadata = 8;
}

enum EntityType {
  UNKNOWN = 0;
  PLAYER = 1;
  ZOMBIE = 10;
  SKELETON = 11;
  CREEPER = 12;
  SPIDER = 13;
  ENDERMAN = 14;
  PIG = 20;
  COW = 21;
  SHEEP = 22;
  CHICKEN = 23;
  HORSE = 24;
  WOLF = 25;
  DROPPED_ITEM = 30;
  EXPERIENCE_ORB = 31;
  ARROW = 32;
}

message EntitySpawnBroadcast {
  EntityData entity = 1;
  SpawnReason spawn_reason = 2;
}

enum SpawnReason {
  NATURAL = 0;
  SPAWNER = 1;
  BREEDING = 2;
  COMMAND = 3;
  ITEM_DROP = 4;
}

message EntityDespawnBroadcast {
  string entity_id = 1;
  DespawnReason reason = 2;
}

enum DespawnReason {
  UNKNOWN = 0;
  LOGOUT = 1;
  DISTANCE = 2;
  MANUAL = 3;
}

// =============================================================================
// World Control
// =============================================================================

message WorldInfo {
  string world_name = 1;
  string world_seed = 2;
  WorldType world_type = 3;
  GameMode default_game_mode = 4;
  bool hardcore_mode = 5;
  int64 world_time = 6;
  int64 day_time = 7;
  WeatherInfo weather = 8;
  SpawnPoint spawn_point = 9;
  WorldBorder world_border = 10;
}

enum WorldType {
  NORMAL = 0;
  FLAT = 1;
  LARGE_BIOMES = 2;
  AMPLIFIED = 3;
  CUSTOMIZED = 4;
}

message WeatherInfo {
  WeatherType weather_type = 1;
  int32 duration_ticks = 2;
  float intensity = 3;
  bool thundering = 4;
}

enum WeatherType {
  CLEAR = 0;
  RAIN = 1;
  THUNDERSTORM = 2;
  SNOW = 3;
}

message SpawnPoint {
  Vector3 position = 1;
  float yaw = 2;
  float pitch = 3;
}

message WorldBorder {
  Vector2 center = 1;
  double diameter = 2;
  double target_diameter = 3;
  int64 time_to_target = 4;
  int32 warning_distance = 5;
  int32 warning_time = 6;
  double damage_per_block = 7;
  double damage_buffer = 8;
}

message Vector2 {
  double x = 1;
  double z = 2;
}

message TimeUpdateBroadcast {
  int64 world_time = 1;
  int64 day_time = 2;
}

message WeatherUpdateBroadcast {
  WeatherInfo weather = 1;
  int64 change_timestamp = 2;
}

// =============================================================================
// Server Status and Diagnostics
// =============================================================================

message ServerStatusResponse {
  string server_version = 1;
  int32 protocol_version = 2;
  int32 online_players = 3;
  int32 max_players = 4;
  float server_tps = 5;
  int64 server_uptime = 6;
  string motd = 7;
  WorldInfo world_info = 8;
  int64 container_hash_mismatches = 9;
  int64 total_tracked_chunks = 10;
  int32 active_chunk_residency_players = 11;
  int32 peak_chunks_per_player = 12;
  string busiest_chunk_player = 13;
  int64 total_deaths = 14;
  int64 total_respawns = 15;
  int64 deaths_last_ten_minutes = 16;
}

// =============================================================================
// Effects and Audio
// =============================================================================

message SoundEffect {
  SoundType sound_type = 1;
  Vector3 position = 2;
  float volume = 3;
  float pitch = 4;
  int32 view_distance = 5;
}

enum SoundType {
  BLOCK_BREAK_STONE = 0;
  BLOCK_BREAK_WOOD = 1;
  BLOCK_PLACE_STONE = 2;
  FOOTSTEP_STONE = 10;
  FOOTSTEP_WOOD = 11;
  ITEM_PICKUP = 20;
  LEVEL_UP = 21;
}

message ParticleEffect {
  ParticleType particle_type = 1;
  Vector3 position = 2;
  Vector3 velocity = 3;
  int32 count = 4;
  float spread = 5;
  string extra_data = 6;
}

enum ParticleType {
  BLOCK_BREAK = 0;
  BLOCK_DUST = 1;
  WATER_SPLASH = 2;
  SMOKE = 3;
  FLAME = 4;
  CRITICAL_HIT = 5;
}

// =============================================================================
// Common Data Structures
// =============================================================================

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

message Vector3Int {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
}

message InventoryItem {
  int32 item_id = 1;
  string item_name = 2;
  int32 quantity = 3;
  int32 durability = 4;
  int32 max_durability = 5;
  repeated Enchantment enchantments = 6;
  string custom_data = 7;
  ItemType item_type = 8;
}

enum ItemType {
  BLOCK = 0;
  TOOL = 1;
  WEAPON = 2;
  ARMOR = 3;
  FOOD = 4;
  MATERIAL = 5;
  MISC = 6;
}

message Enchantment {
  int32 enchant_id = 1;
  int32 level = 2;
}

message TileEntityData {
  Vector3Int position = 1;
  int32 tile_type = 2;
  string tile_data = 3;
}
