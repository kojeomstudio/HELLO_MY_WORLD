syntax = "proto3";
package GameProtocol;
option csharp_namespace = "GameProtocol";

// 인증 관련 메시지
message LoginRequest {
  string username = 1;
  string password = 2;
  string client_version = 3;
}

message LoginResponse {
  bool success = 1;
  string message = 2;
  string session_token = 3;
  PlayerInfo player_info = 4;
}

message LogoutRequest {
  string session_token = 1;
}

message LogoutResponse {
  bool success = 1;
  string message = 2;
}

// 플레이어 정보
message PlayerInfo {
  string player_id = 1;
  string username = 2;
  Vector3 position = 3;
  int32 level = 4;
  int32 health = 5;
  int32 max_health = 6;
  repeated InventoryItem inventory = 7;
}

message Vector3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

message InventoryItem {
  int32 item_id = 1;
  string item_name = 2;
  int32 quantity = 3;
}

// 이동 관련 메시지
message MoveRequest {
  Vector3 target_position = 1;
  float movement_speed = 2;
}

message MoveResponse {
  bool success = 1;
  Vector3 new_position = 2;
  int64 timestamp = 3;
}

// 월드/맵 관련 메시지
message WorldBlockChangeRequest {
  string area_id = 1;
  string subworld_id = 2;
  Vector3Int block_position = 3;
  int32 block_type = 4;
  int32 chunk_type = 5;
}

message WorldBlockChangeResponse {
  bool success = 1;
  string message = 2;
  int64 timestamp = 3;
}

message WorldBlockChangeBroadcast {
  string area_id = 1;
  string subworld_id = 2;
  Vector3Int block_position = 3;
  int32 block_type = 4;
  int32 chunk_type = 5;
  string player_id = 6;
  int64 timestamp = 7;
}

message Vector3Int {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
}

// 채팅 관련 메시지
message ChatMessage {
  string sender_id = 1;
  string sender_name = 2;
  string message = 3;
  ChatType type = 4;
  int64 timestamp = 5;
}

enum ChatType {
  GLOBAL = 0;
  LOCAL = 1;
  WHISPER = 2;
  SYSTEM = 3;
}

message ChatRequest {
  string message = 1;
  ChatType type = 2;
  string target_player = 3; // whisper용
}

message ChatResponse {
  bool success = 1;
  string error_message = 2;
}

// 서버 상태 및 진단
message PingRequest {
  int64 client_timestamp = 1;
}

message PingResponse {
  int64 client_timestamp = 1;
  int64 server_timestamp = 2;
}

message ServerStatusRequest {
  string session_token = 1;
}

message ServerStatusResponse {
    int32 online_players = 1;
    string server_version = 2;
    int64 server_uptime = 3;
    int64 container_hash_mismatches = 4;
}

// ============================================================
// AI 시스템 메시지 (Server-authoritative AI)
// ============================================================

// AI 액터 상태
enum AIState {
    AI_IDLE = 0;
    AI_WANDER = 1;
    AI_CHASE = 2;
    AI_ATTACK = 3;
    AI_FLEE = 4;
    AI_DEAD = 5;
}

// AI 액터 정보
message AIActorInfo {
    int32 actor_id = 1;
    string actor_name = 2;
    Vector3 position = 3;
    AIState state = 4;
    int32 target_id = 5; // 타겟 Actor ID (0이면 타겟 없음)
    int32 health = 6;
    int32 max_health = 7;
}

// AI 상태 동기화 (서버 → 클라이언트)
message AIStateSyncBroadcast {
    repeated AIActorInfo actors = 1;
    int64 timestamp = 2;
}

// AI 공격 이벤트 (서버 → 클라이언트)
message AIAttackEventBroadcast {
    int32 attacker_id = 1;
    int32 target_id = 2;
    int32 damage = 3;
    Vector3 attack_position = 4;
    int64 timestamp = 5;
}

// AI 사망 이벤트 (서버 → 클라이언트)
message AIDeathEventBroadcast {
    int32 actor_id = 1;
    int32 killer_id = 2; // 죽인 플레이어/Actor ID
    Vector3 death_position = 3;
    int64 timestamp = 4;
}

// AI 스폰 요청 (GM 명령어 등)
message AISpawnRequest {
    string ai_type = 1; // "Aggressive", "Defensive", "Boss", etc.
    Vector3 spawn_position = 2;
    string world_id = 3;
}

message AISpawnResponse {
    bool success = 1;
    string message = 2;
    int32 spawned_actor_id = 3;
}

// AI 디버그 정보 요청
message AIDebugInfoRequest {
    int32 actor_id = 1; // 0이면 모든 AI
}

message AIDebugInfoResponse {
    repeated AIActorDebugInfo actors = 1;
}

message AIActorDebugInfo {
    int32 actor_id = 1;
    string actor_name = 2;
    AIState current_state = 3;
    string current_behavior_tree_node = 4;
    float aggro_level = 5;
    int32 perceived_entities_count = 6;
    string lod_level = 7; // LOD 레벨
    float update_rate = 8; // 업데이트 빈도 (Hz)
}
