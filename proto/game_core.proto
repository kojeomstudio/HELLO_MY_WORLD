syntax = "proto3";
package Game.Core;
option csharp_namespace = "Game.Core";
import "common.proto";

message InventoryItem {
  int32 item_id = 1;
  string item_name = 2;
  int32 quantity = 3;
}

message PlayerInfo {
  string player_id = 1;
  string username = 2;
  MinecraftGame.Common.Vector3 position = 3;
  int32 level = 4;
  int32 health = 5;
  int32 max_health = 6;
  repeated InventoryItem inventory = 7;
}

